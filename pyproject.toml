[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "collections-engine"
version = "0.1.0"
description = "RBI-compliant collections dialogue engine (text-in → text-out)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "psycopg[binary,pool]>=3.2.0",
    "pyyaml>=6.0.2",
    "google-cloud-aiplatform>=1.70.0",
    "google-genai>=2.0.0",
    "tzdata>=2024.1",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_upstash: tests that require live Upstash Redis (STUB_MODE=false + creds)",
    "live_kb: tests that require live Fonada KB API (KB_STUB=false + creds)",
    "live_vertex: tests that require live Vertex Gemini (LLM_STUB=false + creds)",
    "compliance: Sprint 6 release-gate compliance suite",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "vertexai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psycopg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psycopg_pool.*"
ignore_missing_imports = true
