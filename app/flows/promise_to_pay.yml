flows:
  promise_to_pay:
    description: >
      Borrower agrees to pay on a future date ("kal", "parso", "next week").
    priority: ptp
    steps:
      - collect: ptp_date
      - action: validate_ptp
        next:
          - if: "ptp_allowed == true"
            then: accept
          - else: counter
      - id: accept
        utter: confirm_ptp
        next: schedule
      - id: schedule
        action: schedule_followup
        next: end
      - id: counter
        utter: ask_earlier_date
        next: end
responses:
  confirm_ptp:
    - text: "Theek hai sir, {ptp_date} note kar liya. Us din tak {amount_due} jama karna hoga."
      language: hi
    - text: "Okay sir, {ptp_date} noted. Please pay {amount_due} by then."
      language: en
    - text: "Theek hai sir, {ptp_date} note kar liya — {amount_due} jama karna hoga."
      language: hinglish
  ask_earlier_date:
    - text: "Itni der mushkil hai sir. Is hafte tak kuch ho sakta hai?"
      language: hi
    - text: "Itni der tough hai sir. Is week kuch ho sakta hai?"
      language: hinglish
    - text: "That long is difficult sir. Something this week?"
      language: en
  ask_ptp_date:
    - text: "Aap kab payment kar sakte hain? Kal, parso ya koi date batayein."
      language: hi
  clarify_general:
    - text: "Main sun raha hoon. EMI kab pay kar sakte hain, ya koi sawal hai?"
      language: hi
