  plo_pd3_greeting:
    - text: "नमस्ते {customer_name}, मैं अर्जुन बोल रहा हूँ पैसालो से। आपकी ₹{repay_amount} की कुल राशि {days_past_due} दिनों से देय है। कृपया ध्यान दें, यदि आप तुरंत अपनी बकाया किश्त का भुगतान नहीं करते हैं तो आपके विरुद्ध सख़्त कार्रवाई की जाएगी।"
      language: hi
  plo_pd3_ask:
    - text: "क्या आप अपनी बकाया राशि का भुगतान तुरंत करेंगे?"
      language: hi
  plo_pd3_refuse:
    - text: "यह बिल्कुल अस्वीकार्य है {customer_name}। आपने पहले ही काफी देर कर दी है। यदि आप तुरंत भुगतान नहीं करते हैं तो आपको किसी भी प्रकार का लोन लेना बेहद कठिन हो जाएगा। साथ ही, आपका खाता NPA घोषित किया जा सकता है, जिसके कानूनी परिणाम भी भुगतने पड़ सकते हैं। क्या आप अभी भुगतान करेंगे?"
      language: hi
      attempt: 1
    - text: "{customer_name}, यदि आप शीघ्र भुगतान नहीं करते हैं, तो इसका नकारात्मक असर पड़ेगा। इसके अतिरिक्त, भविष्य में आपको किसी भी प्रकार का ऋण प्राप्त करना अत्यंत कठिन हो जाएगा और आपके विरुद्ध कानूनी प्रक्रिया भी प्रारम्भ हो सकती है। हम आपको दृढ़ता से सलाह देते हैं कि आप तुरंत अपनी बकाया राशि का भुगतान करें। क्या आप अभी भुगतान करने के लिए तैयार हैं?"
      language: hi
      attempt: 2
  plo_pd3_assurance:
    - text: "मुझे उम्मीद है कि आपको पता है कि आपको लोन लेते समय दिए गए QR कोड पर ही भुगतान करना है। क्या मैं आपकी और कोई मदद कर सकता हूँ?"
      language: hi
  plo_pd3_close:
    - text: "कृपया जल्द से जल्द भुगतान करें। आपका धन्यवाद।"
