# PaisaLo opener — identity + scenario routing.
# SOURCE: PDF p.2–4 AI greeting adapted. Scenario select routes to predue/ondue/postdue/npa.
# OCR_UNSURE: none in this file (all text is new composition)
#
# FIX-A: select_plo_scenario runs as step 1 (before any utterance) so voice_id /
# tts_model / tts_pace are set before the first TTS synthesis — the caller never
# hears the default male (amit) voice on a predue/ondue call. The opener greet
# is the scenario-specific PDF Initial Greeting (Anjali predue/ondue, Neha pd1/2,
# Arjun pd3); NPA is consent-first AFTER identity, so its consent greeting stays
# in plo_npa and the opener speaks a persona intro + identity ask for NPA.

flows:
  plo_opener:
    description: >
      PaisaLo opener: greet (scenario-specific) + confirm identity, route to
      correct scenario (predue, ondue, postdue1/2/3, npa) based on days_past_due bucket.
    priority: identity
    steps:
      - action: select_plo_scenario
        next: greet

      - id: greet
        decide:
          - if: "customer_name == null"
            then: greet_unknown
          - if: "plo_scenario == predue"
            then: greet_predue
          - if: "plo_scenario == ondue"
            then: greet_ondue
          - if: "plo_scenario == postdue1"
            then: greet_pd1
          - if: "plo_scenario == postdue2"
            then: greet_pd2
          - if: "plo_scenario == postdue3"
            then: greet_pd3
          - if: "plo_scenario == npa"
            then: greet_npa
          - else: ask_identity

      - id: greet_unknown
        utter: plo_greeting_unknown
        next: wait_identity
      - id: greet_predue
        utter: plo_predue_greeting
        next: ask_identity
      - id: greet_ondue
        utter: plo_ondue_greeting
        next: ask_identity
      - id: greet_pd1
        utter: plo_pd1_greeting
        next: ask_identity
      - id: greet_pd2
        utter: plo_pd2_greeting
        next: ask_identity
      - id: greet_pd3
        utter: plo_pd3_greeting
        next: ask_identity
      - id: greet_npa
        utter: plo_npa_opener_identity
        next: wait_identity

      - id: ask_identity
        utter: plo_identity_ask
        next: wait_identity

      - id: wait_identity
        collect: plo_identity_response
        next: route_identity

      - id: route_identity
        decide:
          - if: "plo_identity_response == confirmed"
            then: confirm_self
          - if: "plo_identity_response == wrong_number"
            then: wrong_number
          - else: retry_identity

      - id: retry_identity
        utter: plo_identity_ask
        next: wait_identity

      - id: confirm_self
        action: set_identity_ok
        next: route_scenario

      - id: route_scenario
        decide:
          - if: "plo_scenario == predue"
            then: go_predue
          - if: "plo_scenario == ondue"
            then: go_ondue
          - if: "plo_scenario == postdue1"
            then: go_postdue1
          - if: "plo_scenario == postdue2"
            then: go_postdue2
          - if: "plo_scenario == postdue3"
            then: go_postdue3
          - if: "plo_scenario == npa"
            then: go_npa
          - else: go_postdue1

      - id: go_predue
        action: plo_chain_predue
        next: end

      - id: go_ondue
        action: plo_chain_ondue
        next: end

      - id: go_postdue1
        action: plo_chain_postdue1
        next: end

      - id: go_postdue2
        action: plo_chain_postdue2
        next: end

      - id: go_postdue3
        action: plo_chain_postdue3
        next: end

      - id: go_npa
        action: plo_chain_npa
        next: end

      - id: wrong_number
        utter: plo_wrong_number
        next: wrong_hangup

      - id: wrong_hangup
        action: hangup_call
        next: end

responses:
  plo_identity_ask:
    - text: "क्या मेरी बात {customer_name} जी से हो रही है?"
      language: hi
  plo_npa_opener_identity:
    - text: "नमस्ते {customer_name} जी, मैं अमन पैसालो से बोल रहा हूँ। क्या मेरी बात {customer_name} जी से हो रही है?"
      language: hi
  plo_greeting_unknown:
    - text: "नमस्ते, मैं पैसालो से बोल रही हूँ। क्या मेरी बात आपसे हो रही है?"
      language: hi
  plo_wrong_number:
    - text: "माफ़ कीजिए, यह नंबर गलत लग रहा है। आपका दिन शुभ हो।"
      language: hi
  plo_reask_intent:
    - text: "क्या आप यह भुगतान कर पाएंगे?"
      language: hi
  plo_reask_timeline:
    - text: "आप इस बकाया राशि के समाधान के लिए कब तक आगे बढ़ पाएँगे?"
      language: hi
  plo_reask_consent:
    - text: "क्या अभी दो मिनट बात हो पाएगी?"
      language: hi
