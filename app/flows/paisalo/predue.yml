# PaisaLo PREDUE — AI ladder adapted from IVR copy (Anjali voice).
# SOURCE: PDF p.2 IVR adapted to AI (DTMF out of scope).
# OCR_UNSURE: none (predue text is clean in source)

flows:
  plo_predue:
    description: >
      PaisaLo predue reminder: amount due before due date, soft collect
      payment intent, acknowledge or gentle push.
    priority: ptp
    steps:
      - id: greet
        utter: plo_predue_greeting
        next: wait_intent

      - id: wait_intent
        collect: plo_payment_intent
        next: route_intent

      - id: route_intent
        decide:
          - if: "plo_payment_intent == willing"
            then: ack_willing
          - if: "plo_payment_intent == later"
            then: soft_push
          - else: soft_push

      - id: ack_willing
        utter: plo_predue_ack
        next: do_hangup

      - id: soft_push
        utter: plo_predue_push
        next: wait_intent2

      - id: wait_intent2
        collect: plo_payment_intent
        next: route_intent2

      - id: route_intent2
        decide:
          - if: "plo_payment_intent == willing"
            then: ack_willing
          - else: ack_close

      - id: ack_close
        utter: plo_predue_close
        next: do_hangup

      - id: do_hangup
        action: hangup_call
        next: end

responses:
  plo_predue_greeting:
    - text: "नमस्ते {customer_name} जी, मैं अंजली पैसालो से बोल रही हूँ। आपकी ₹{repay_amount} की कुल किश्त देय है। कृपया इसे समय पर केवल पैसालो के QR कोड या नज़दीकी शाखा में जमा करें। क्या आप समय पर भुगतान कर पाएँगे?"
      language: hi
  plo_predue_ack:
    - text: "बहुत अच्छा! कृपया पैसालो के QR कोड या शाखा में ही भुगतान करें। आपका धन्यवाद।"
      language: hi
  plo_predue_push:
    - text: "कृपया ध्यान दें कि समय पर भुगतान न करने से आपके क्रेडिट स्कोर पर असर पड़ सकता है। क्या आप इसे जल्द भर पाएँगे?"
      language: hi
  plo_predue_close:
    - text: "ठीक है, कृपया जल्द से जल्द भुगतान कर दें। आपका धन्यवाद।"
      language: hi
