# Salary On Time — PRE-CLOSURE complete script (Hindi voice agent).
# Source of truth: Websocket/salary_on_time_flow (Section 1: Pre-Closure).
# Entry via agent_id=salary-on-time(-test) or force_flow=sot_opener.
#
# Flow map:
#   sot_opener            -> identity + third-party branch C (compliance critical)
#   sot_offer_pre_closure -> Step 2 offer (chains to commit / push / already-paid loop)
#   sot_push              -> Step 3 reason + push
#   sot_commit            -> Step 4 date/time commitment branches
#   sot_close             -> Step 5 STRICT order: send_whatsapp -> closing utter -> hangup
#   sot_obj_*             -> objection layer (dispute priority, pushed on top, resume parent)
#
# Third-person (C1 family): third_person_mode slot selects *_tp response variants via decide.

flows:
  # =====================================================================
  # STEP 1 — Identity + Third-party (Branch C)
  # =====================================================================
  sot_opener:
    description: >
      Salary On Time pre-closure opener: greet + confirm identity, handle
      third-party branch C (immediate family / sibling / restricted).
    priority: identity
    steps:
      - utter: sot_greeting
        next: wait_identity

      - id: wait_identity
        collect: sot_identity_response
        next: route_identity

      - id: route_identity
        decide:
          - if: "sot_identity_response == confirmed"
            then: confirm_self
          - if: "sot_identity_response == relation"
            then: ask_relation
          - if: "sot_identity_response == denied"
            then: ask_knows
          - else: retry_identity

      - id: retry_identity
        utter: sot_greeting
        next: reset_identity

      - id: reset_identity
        action: sot_reset_identity
        next: wait_identity

      - id: confirm_self
        action: set_identity_ok
        next: go_offer

      # Pick the sub-script by due_date: future -> pre-closure, today -> on-due,
      # past -> post-due. Identity + Branch C above are shared by all three.
      - id: go_offer
        action: select_sot_scenario
        next: route_scenario

      - id: route_scenario
        decide:
          - if: "sot_scenario == on_due"
            then: go_offer_ondue
          - if: "sot_scenario == post_due"
            then: go_offer_postdue
          - else: go_offer_pre

      - id: go_offer_pre
        action: sot_chain_offer
        next: end

      - id: go_offer_ondue
        action: sot_chain_offer_ondue
        next: end

      - id: go_offer_postdue
        action: sot_chain_offer_postdue
        next: end

      # --- caller does not confirm and did not state a relation ---
      - id: ask_knows
        collect: sot_knows_customer
        next: route_knows

      - id: route_knows
        decide:
          - if: "sot_knows_customer == true"
            then: ask_relation
          - else: wrong_number

      - id: ask_relation
        collect: sot_relation_type
        next: branch_c

      # --- Branch C: classify relation ---
      - id: branch_c
        action: classify_sot_relation
        next: route_tp

      - id: route_tp
        decide:
          - if: "sot_tp_class == immediate_family"
            then: tp_family
          - if: "sot_tp_class == sibling"
            then: tp_sibling_ask
          - else: tp_restricted

      # C1 — immediate family: authorized third-person, proceed to offer
      - id: tp_family
        action: set_sot_family_authorized
        next: go_offer

      # C2 — sibling: cousin vs real sibling
      - id: tp_sibling_ask
        collect: sot_sibling_type
        next: route_sibling

      - id: route_sibling
        decide:
          - if: "sot_sibling_type == real"
            then: tp_family
          - else: tp_restricted

      # C3 — restricted: NEVER reveal loan/offer/link/company detail
      - id: tp_restricted
        action: activate_sot_restricted_mode
        next: restricted_intro

      - id: restricted_intro
        utter: sot_restricted_intro
        next: wait_restricted

      - id: wait_restricted
        collect: sot_restricted_followup
        next: route_restricted

      - id: route_restricted
        decide:
          - if: "sot_restricted_followup == wants_details"
            then: restricted_deny
          - if: "sot_restricted_followup == alternate_number"
            then: restricted_alt
          - else: restricted_close

      - id: restricted_deny
        utter: sot_restricted_security
        next: restricted_reset

      - id: restricted_reset
        action: sot_reset_restricted
        next: wait_restricted

      - id: restricted_alt
        utter: sot_restricted_alt_number
        next: restricted_close

      - id: restricted_close
        action: hangup_call
        next: end

      # --- caller doesn't know the customer: wrong number ---
      - id: wrong_number
        utter: sot_wrong_number
        next: wrong_update

      - id: wrong_update
        action: update_phone_record
        next: wrong_hangup

      - id: wrong_hangup
        action: hangup_call
        next: end

  # =====================================================================
  # STEP 2 — Offer
  # =====================================================================
  sot_offer_pre_closure:
    description: >
      Pre-closure offer: repay_amount due by due_date, save discount_amount today,
      2-minute re-loan. Branches to commitment / push / already-paid loop.
    priority: ptp
    steps:
      - id: pick_offer
        decide:
          - if: "third_person_mode == true"
            then: offer_tp
          - else: offer_self

      - id: offer_self
        utter: sot_offer_pre_closure
        next: offer_self_ask

      - id: offer_self_ask
        utter: sot_offer_ask_today
        next: wait_pi

      - id: offer_tp
        utter: sot_offer_pre_closure_tp
        next: offer_tp_ask

      - id: offer_tp_ask
        utter: sot_offer_ask_today_tp
        next: wait_pi

      - id: wait_pi
        collect: sot_payment_intent
        next: route_pi

      - id: route_pi
        decide:
          - if: "sot_payment_intent == willing"
            then: set_offer_today
          - if: "sot_payment_intent == already_paid"
            then: paid_ack
          - else: go_push

      # "Kya aap aaj payment karenge?" -> yes means today: only ask the time next.
      - id: set_offer_today
        action: sot_set_offer_today
        next: go_commit

      - id: go_commit
        action: sot_chain_commit
        next: end

      - id: go_push
        action: sot_chain_push
        next: end

      # "Already paid" is a terminal branch: acknowledge, ask for proof
      # (screenshot/reference to info@) and CLOSE. Do NOT loop back to wait_pi
      # (re-asking payment intent) — that caused the borrower to hear the offer
      # again after saying they had paid.
      - id: paid_ack
        utter: sot_already_paid
        next: paid_mark

      - id: paid_mark
        action: sot_mark_claims_paid
        next: paid_hangup

      - id: paid_hangup
        action: hangup_call
        next: end

  # =====================================================================
  # STEP 3 — Reason + Push
  # =====================================================================
  sot_push:
    description: >
      Ask the reason, then push on saving + re-loan angle. On agreement chain to
      commitment; otherwise ask for a due-date time and commit on-due.
    priority: ptp
    steps:
      - id: ask_reason
        collect: sot_payment_problem
        next: pick_push

      - id: pick_push
        decide:
          - if: "third_person_mode == true"
            then: push_tp
          - else: push_self

      - id: push_self
        utter: sot_push
        next: wait_push

      - id: push_tp
        utter: sot_push_tp
        next: wait_push

      - id: wait_push
        collect: sot_payment_intent_2
        next: route_push

      - id: route_push
        decide:
          - if: "sot_payment_intent_2 == willing"
            then: push_today
          # Not willing to pay today -> go to commitment and ask WHEN (date/time),
          # then classify the answer. Do NOT force on_due: the borrower may name a
          # date before/after the due date. Forcing on_due produced a wrong
          # "aaj hi due date hai" push that looped forever when the borrower replied
          # with a date (which set sot_commit_timing, never the yes/no slot).
          - else: go_commit

      # Agreed to pay today during the push -> only ask the time (date-confirm rule).
      - id: push_today
        action: sot_set_offer_today
        next: go_commit

      - id: go_commit
        action: sot_chain_commit
        next: end

  # =====================================================================
  # STEP 4 — Payment commitment (date/time branches)
  # =====================================================================
  sot_commit:
    description: >
      Capture committed date/time. Branches: today / tomorrow / before-due /
      on-due / after-due. After-due commitment degrades to a simulated transfer.
    priority: ptp
    steps:
      - id: classify_timing
        action: classify_sot_commit_timing
        next: route_timing

      - id: route_timing
        decide:
          - if: "sot_commit_timing == today"
            then: today_time
          - if: "sot_commit_timing == tomorrow"
            then: tomorrow_time
          - if: "sot_commit_timing == before_due"
            then: before_time
          - if: "sot_commit_timing == on_due"
            then: ondue_push
          - if: "sot_commit_timing == after_due"
            then: afterdue_warn
          - else: ask_timing

      - id: ask_timing
        collect: sot_commit_timing
        next: classify_timing

      # --- TODAY ---
      - id: today_time
        collect: sot_customer_time
        next: today_confirm

      - id: today_confirm
        decide:
          - if: "third_person_mode == true"
            then: today_confirm_tp
          - else: today_confirm_self

      - id: today_confirm_self
        utter: sot_confirm_today
        next: wait_final

      - id: today_confirm_tp
        utter: sot_confirm_today_tp
        next: wait_final

      # --- TOMORROW ---
      - id: tomorrow_time
        collect: sot_customer_time
        next: tomorrow_push

      # Pre-closure = discount angle; on/post-due = penalty angle (scenario-aware).
      - id: tomorrow_push
        decide:
          - if: "sot_scenario == on_due"
            then: tomorrow_push_od
          - if: "sot_scenario == post_due"
            then: tomorrow_push_pd
          - else: tomorrow_push_pre

      - id: tomorrow_push_pre
        utter: sot_tomorrow_push
        next: tomorrow_confirm

      - id: tomorrow_push_od
        utter: sotod_tomorrow_push
        next: tomorrow_confirm

      - id: tomorrow_push_pd
        utter: sotpd_tomorrow_push
        next: tomorrow_confirm

      - id: tomorrow_confirm
        decide:
          - if: "third_person_mode == true"
            then: tomorrow_confirm_tp
          - else: tomorrow_confirm_self

      - id: tomorrow_confirm_self
        utter: sot_confirm_tomorrow
        next: wait_final

      - id: tomorrow_confirm_tp
        utter: sot_confirm_tomorrow_tp
        next: wait_final

      # --- BEFORE DUE ---
      - id: before_time
        collect: sot_customer_time
        next: before_confirm

      - id: before_confirm
        decide:
          - if: "third_person_mode == true"
            then: before_confirm_tp
          - else: before_confirm_self

      - id: before_confirm_self
        utter: sot_confirm_before_due
        next: wait_final

      - id: before_confirm_tp
        utter: sot_confirm_before_due_tp
        next: wait_final

      # --- ON DUE ---
      - id: ondue_push
        utter: sot_ondue_push
        next: ondue_recheck

      - id: ondue_recheck
        collect: sot_ondue_decision
        next: route_ondue

      - id: route_ondue
        decide:
          - if: "sot_ondue_decision == pay_today"
            then: today_time
          - else: ondue_time

      - id: ondue_time
        collect: sot_customer_time
        next: ondue_confirm

      - id: ondue_confirm
        utter: sot_confirm_ondue
        next: wait_final

      # --- AFTER DUE (4.2B) ---
      - id: afterdue_warn
        decide:
          - if: "sot_scenario == on_due"
            then: afterdue_warn_od
          - if: "sot_scenario == post_due"
            then: afterdue_warn_pd
          - else: afterdue_warn_pre

      - id: afterdue_warn_pre
        utter: sot_afterdue_warning
        next: afterdue_recheck

      - id: afterdue_warn_od
        utter: sotod_afterdue_warning
        next: afterdue_recheck

      - id: afterdue_warn_pd
        utter: sotpd_afterdue_warning
        next: afterdue_recheck

      - id: afterdue_recheck
        collect: sot_afterdue_decision
        next: route_afterdue

      - id: route_afterdue
        decide:
          - if: "sot_afterdue_decision == pay_today"
            then: today_time
          - else: afterdue_transfer

      - id: afterdue_transfer
        action: transfer_call
        next: end

      # --- FINAL CONFIRM -> CLOSE ---
      - id: wait_final
        collect: sot_final_confirm
        next: route_final

      - id: route_final
        decide:
          - if: "sot_final_confirm == yes"
            then: go_close
          - if: "sot_final_confirm == no"
            then: reset_timing
          # Unclear / borrower re-stated the time instead of yes/no — re-ask the
          # confirmation WITHOUT wiping the captured commitment (prevents the
          # "kis time tak? -> sham -> asks time again" loop).
          - else: reconfirm

      - id: reconfirm
        action: sot_reset_final
        next: wait_final

      - id: reset_timing
        action: sot_reset_commit
        next: route_timing

      - id: go_close
        action: sot_chain_close
        next: end

  # =====================================================================
  # STEP 5 — Close (STRICT ORDER: send_whatsapp -> closing utter -> hangup)
  # =====================================================================
  sot_close:
    description: >
      Mandatory close. Order never changes: send WhatsApp link, speak the closing
      line (final audio), then hang up.
    priority: ptp
    steps:
      - action: send_whatsapp_message
        next: pick_close

      - id: pick_close
        decide:
          - if: "third_person_mode == true"
            then: close_tp
          - else: close_self

      - id: close_self
        utter: sot_close
        next: do_hangup

      - id: close_tp
        utter: sot_close_tp
        next: do_hangup

      - id: do_hangup
        action: hangup_call
        next: end

  # =====================================================================
  # OBJECTION LAYER — dispute priority; pushed on top, resume parent on pop.
  # =====================================================================

  # --- objections that END IN TRANSFER (simulated) ---
  sot_obj_never_loan:
    description: "Borrower denies taking the loan. Triggers: maine koi loan nahi liya, mujhe loan liya hi nahi, yeh loan mera nahi hai, kaisa loan, maine apply hi nahi kiya, I never took any loan."
    priority: dispute
    steps:
      - utter: sot_obj_never_loan
        next: do_transfer
      - id: do_transfer
        action: transfer_call
        next: end

  sot_obj_medical:
    description: "Borrower has a medical/health problem or hospital expense. Triggers: mujhe medical problem hai, tabiyat kharab hai, hospital mein hun, bimar hun, ilaaj chal raha hai, medical emergency, operation hua hai."
    priority: dispute
    steps:
      - utter: sot_obj_medical
        next: do_transfer
      - id: do_transfer
        action: transfer_call
        next: end

  sot_obj_job_loss:
    description: "Borrower lost job or income is uncertain. Triggers: naukri chali gayi, job chhoot gayi, kaam nahi hai, salary nahi aayi, income band hai, berozgaar hun, business band ho gaya, lost my job."
    priority: dispute
    steps:
      - utter: sot_obj_job_loss
        next: do_transfer
      - id: do_transfer
        action: transfer_call
        next: end

  sot_obj_no_timeline:
    description: "Borrower cannot commit any payment date or timeline. Triggers: pata nahi kab de paunga, abhi keh nahi sakta, koi date nahi bata sakta, kab hoga pata nahi, dekhte hain kab, abhi confirm nahi kar sakta, abhi paise nahi hai pata nahi kab honge, I don't know when I can pay, can't say when."
    priority: dispute
    steps:
      - utter: sot_obj_no_timeline
        next: do_transfer
      - id: do_transfer
        action: transfer_call
        next: end

  sot_obj_wrong_amount:
    description: "Borrower disputes the repayment amount OR the charges/fees/interest applied — claims the amount or charges are wrong/extra/unfair, or demands charges be removed before paying. Triggers: amount galat hai, itna nahi liya tha, yeh amount sahi nahi hai, maine kam liya tha, calculation galat hai, wrong amount, total zyada dikha rahe ho, galat charges laga rakhe hain, galat galat charges lagaye hain, extra charges lagaye hain, faltu charges, ye charges hatao, charges hata do phir payment karunga, charges kam karo tab pay karunga, jyada charge kar rahe ho, unnecessary charges, extra interest laga diya, wrong charges, remove the charges."
    priority: dispute
    steps:
      - utter: sot_obj_wrong_amount
        next: do_transfer
      - id: do_transfer
        action: transfer_call
        next: end

  sot_obj_frozen_account:
    description: "Borrower's bank account is frozen/blocked. Triggers: account freeze ho gaya, account block hai, bank account band hai, paise nikal nahi sakta, account seize ho gaya, account frozen."
    priority: dispute
    steps:
      - utter: sot_obj_frozen_account
        next: do_transfer
      - id: do_transfer
        action: transfer_call
        next: end

  sot_obj_death:
    description: "Death in the family / bereavement. Triggers: ghar mein death ho gayi, kisi ki mrityu ho gayi, papa nahi rahe, family member guzar gaye, maatam hai, death in family."
    priority: dispute
    steps:
      - utter: sot_obj_death
        next: do_transfer
      - id: do_transfer
        action: transfer_call
        next: end

  sot_obj_out_of_station:
    description: "Borrower is out of station / travelling. Triggers: bahar gaya hun, out of station hun, travel par hun, gaon gaya hun, shehar se bahar hun, abhi yahan nahi hun, travelling."
    priority: dispute
    steps:
      - utter: sot_obj_out_of_station
        next: do_transfer
      - id: do_transfer
        action: transfer_call
        next: end

# ORPHAN(2026-08-09): candidate orphan, kept due to FORCE_FLOW_ALIASES ref. Next sweep: re-check after alias cleanup.
  sot_obj_credit_manager:
    description: "Borrower says a credit manager/agent allowed extra 2-3 days. Triggers: credit manager ne 2-3 din bole the, manager ne time diya hai, unhone kaha tha baad mein de dena, agent ne extension diya, 2-3 din ka time mila hai."
    priority: dispute
    steps:
      - utter: sot_obj_credit_manager
        next: do_transfer
      - id: do_transfer
        action: transfer_call
        next: end

# ORPHAN(2026-08-09): candidate orphan, kept due to FORCE_FLOW_ALIASES ref. Next sweep: re-check after alias cleanup.
  sot_obj_references_called:
    description: "Borrower angry that references/contacts were called. Triggers: aapne mere reference ko kyun call kiya, ghar walon ko kyun phone kiya, doston ko kyun call kiya, mere contacts ko kyun bola, family ko kyun bataya."
    priority: dispute
    steps:
      - utter: sot_obj_references_called
        next: do_transfer
      - id: do_transfer
        action: transfer_call
        next: end

# ORPHAN(2026-08-09): candidate orphan, kept due to FORCE_FLOW_ALIASES ref. Next sweep: re-check after alias cleanup.
  sot_obj_pending_status:
    description: "Borrower paid but system still shows pending. Triggers: maine pay kiya par pending dikha raha hai, payment ho gayi par update nahi hui, system mein nahi dikh raha, paisa kat gaya par show nahi ho raha, deduct ho gaya par pending."
    priority: dispute
    steps:
      - utter: sot_obj_pending_status
        next: do_transfer
      - id: do_transfer
        action: transfer_call
        next: end

# ORPHAN(2026-08-09): candidate orphan, kept due to FORCE_FLOW_ALIASES ref. Next sweep: re-check after alias cleanup.
  sot_obj_cant_login:
    description: "Borrower cannot login or is not getting OTP. Triggers: login nahi ho raha, OTP nahi aa raha, app khul nahi rahi, password galat bata raha, account access nahi ho raha, cannot login, OTP not coming."
    priority: dispute
    steps:
      - utter: sot_obj_cant_login
        next: do_transfer
      - id: do_transfer
        action: transfer_call
        next: end

  # --- objections that ANSWER + RESUME (no transfer) ---
  sot_obj_enhanced_amount:
    description: "Borrower asks how much the next/enhanced re-loan will be. Triggers: agla loan kitna milega, enhanced limit kitni hai, naya loan kitne ka milega, 20% zyada kitna hota hai, re-loan amount kitna, badhi hui limit kitni."
    priority: dispute
    steps:
      - action: sot_calc_enhanced
        next: say
      - id: say
        utter: sot_obj_enhanced_amount
        next: end

  sot_obj_penalty:
    description: "Borrower asks about penalty/late charges after due date. Triggers: penalty kitni lagegi, late fee kya hai, charges kitne honge, due date ke baad kitna extra, jurmana kitna, kitni penalty lagti hai."
    priority: dispute
    steps:
      - utter: sot_obj_penalty
        next: end

# ORPHAN(2026-08-09): candidate orphan, kept due to FORCE_FLOW_ALIASES ref. Next sweep: re-check after alias cleanup.
  sot_obj_processing_fee:
    description: "Borrower asks about processing fee or interest on the re-loan. Triggers: processing fee kitni hai, naye loan par byaaj kitna, re-loan ka interest kya hai, charges kya lagenge naye loan par, processing charges kitne."
    priority: dispute
    steps:
      - utter: sot_obj_processing_fee
        next: end

  sot_obj_high_interest:
    description: "Borrower complains interest rate is too high. Triggers: interest bahut zyada hai, byaaj zyada hai, rate high hai, itna interest kyun, sood bahut hai, interest is too much, bahut mehenga hai."
    priority: dispute
    steps:
      - utter: sot_obj_high_interest
        next: end

  sot_obj_link_request:
    description: "Borrower asks for the payment link. Triggers: link bhej do, payment link send karo, WhatsApp par link bhejo, mujhe link chahiye, kaise pay karun link do, send me the link."
    priority: dispute
    steps:
      - utter: sot_obj_link_request
        next: send_link
      - id: send_link
        action: send_whatsapp_message
        next: ask_received
      # After sending, confirm receipt instead of resuming the push ladder. Both
      # branches end in hangup_call so the call always closes gracefully once the
      # link is handled (fixes the live call that never disconnected).
      - id: ask_received
        collect: sot_link_received
        next: route_received
      - id: route_received
        decide:
          - if: "sot_link_received == not_received"
            then: retry_resend
          - else: thanks_close
      # Not received: silently re-send once, reassure (network delay), then close.
      - id: retry_resend
        action: send_whatsapp_message
        next: retry_utter
      - id: retry_utter
        utter: sot_link_retry_wait
        next: retry_hangup
      - id: retry_hangup
        action: hangup_call
        next: end
      # Received / unclear / silence: thank and close.
      - id: thanks_close
        utter: sot_link_thanks_close
        next: close_hangup
      - id: close_hangup
        action: hangup_call
        next: end

# ORPHAN(2026-08-09): candidate orphan, kept due to FORCE_FLOW_ALIASES ref. Next sweep: re-check after alias cleanup.
  sot_obj_month_only:
    description: "Borrower gives only a month, not a specific date. Triggers: agle mahine, is month, next month de dunga, mahine ke end mein, January mein, koi mahina bola par date nahi, only said a month."
    priority: dispute
    steps:
      - utter: sot_obj_month_only
        next: end

# ORPHAN(2026-08-09): candidate orphan, kept due to FORCE_FLOW_ALIASES ref. Next sweep: re-check after alias cleanup.
  sot_obj_support_number:
    description: "Borrower asks for a customer support/helpline number. Triggers: customer care number do, support number kya hai, helpline number batao, kahan call karun, contact number do, customer support."
    priority: dispute
    steps:
      - utter: sot_obj_support_number
        next: end

  sot_obj_busy:
    description: "Borrower is busy / asks to call later. Triggers: abhi busy hun, baad mein call karo, abhi time nahi hai, meeting mein hun, thodi der baad, call me later, abhi baat nahi kar sakta."
    priority: dispute
    steps:
      - utter: sot_obj_busy
        next: end

  sot_obj_hold:
