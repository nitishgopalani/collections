respond_enabled: true
unknown_info_reply: "यह सवाल मैं नोट कर रहा हूँ, संबंधित टीम आपसे संपर्क करेगी। अधिक जानकारी के लिए info@salaryontime.com पर मेल करें।"
# W1-B (H2 dead-air defense): terminal apology spoken by the go-server when
# ASR reconnect is exhausted (deaf) or TTS speak-fails twice (mute). Spoken in
# the unknown_info-register voice. SOT variant TBD — uses the same register as
# unknown_info_reply. PENDING-CLIENT-APPROVAL (PAISALO_FRAGMENT_LIBRARY_V1.md §H).
apology_dead_air: "माफ़ कीजिए, लाइन में तकनीकी समस्या आ रही है। हम आपसे थोड़ी देर में दोबारा संपर्क करेंगे। धन्यवाद।"
# D-4: explicit TTS defaults (amit @ bulbul:v3, pace 1.1) — not env-luck.
voice_id: amit
tts_model: bulbul:v3
tts_pace: 1.1
# D-1 / P4.5: SOT keeps an empty allowlist (gate currently off for this tenant).
gate_allowlisted_phrases: []
scenario_selector: due_date
frustration_escalate_turns: 3
reversal_target_flow: sot_obj_no_timeline
identity_slot: sot_identity_response
final_confirm_slot: sot_final_confirm
link_received_slot: sot_link_received
call_closed_slot: sot_call_closed
reason_slot: sot_payment_problem
dispute_loan_tokens:
- loan
- लोन
# W2-1 evidence scorer: backchannel acknowledgment tokens — PURE LISTENER
# NODS (not yes/willing answers). A transcript that is (almost) entirely
# these → evidence=0 (non-addressed / HOLD). haan/theek/ji are EXCLUDED —
# they are yes/willing tokens (score 2/3), not pure nods. Roman + Devanagari.
backchannel_tokens:
- hmm
- achha
- accha
- ok
- okay
- okey
- hmmji
- हम्म
- अच्छा
- ओके
