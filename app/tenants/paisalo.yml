- plo_obj_npa_already_paid
- plo_obj_which_emi_pd
- plo_obj_which_emi
dispute_flows:
- plo_obj_deny_loan_pd
- plo_obj_deny_loan
- plo_obj_waiver_political_pd
- plo_obj_waiver_political
coercion_chain:
- dispute
- willing
- refusal
- identity
- reason_catchall
respond_enabled: true
unknown_info_reply: "माफ़ कीजिए {customer_name} जी, यह जानकारी अभी मेरे पास उपलब्ध नहीं है। सही जानकारी के लिए कृपया {branch} ब्रांच या पैसालो हेल्पलाइन से संपर्क करें।"
# Hits-only (P5.4 dry-run). Lexicon OCR variants that never appeared in copy
# (कानूनी कार्यवाही / कारवाही, सख़्त कार्यवाही, डिफ़ॉल्ट का सामना) omitted.
