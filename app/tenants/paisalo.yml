# PaisaLo tenant runtime profile (Phase 5).
# Slot mapping (PDF → engine): amount→repay_amount, customer_name, days_past_due,
# loan_amount, disbursal_date, last_date_paid, branch, branch_address, committed_date.
#
# D-4 voice (select_plo_scenario): predue/ondue→priya, postdue1/2→neha,
# postdue3→kabir, npa→amit; tts_model=bulbul:v3 per-call; tts_pace baseline 1.1
# for predue/ondue/postdue1/2; postdue3=0.95, npa=1.0 (relative sternness).
#
# P5.4 — gate_allowlisted_phrases derived from dry-run hits against the Hindi
# legal/NPA pressure family (see scripts/_p5_gate_hits.txt). "emi" hits are
# OUT OF FAMILY and are NOT allowlisted.
tenant_id: paisalo
flow_prefix: plo_
objection_prefix: plo_obj_
# --- DT profile fields (Phase A2) ---
supports_committed_date_coercion: false
timing_slot_set: []
ltl_enforce_enabled: false
identity_bypass_flows:
- plo_opener
allow_sot_test_mode: false
test_borrower_factory: hardcoded_paisalo_borrower
test_borrower_id: plo_test_borrower
test_agent_id: paisalo-test
test_loan_keys:
- customer_name
- repay_amount
- loan_amount
- due_date
- disbursal_date
- amount_due
- days_past_due
- dpd
- branch
- branch_address
- last_date_paid
- product
- npa_flag
- committed_date
test_scenario_override_slot: plo_scenario_override
onrails_flows:
- plo_opener
- plo_predue
- plo_ondue
- plo_postdue1
- plo_postdue2
- plo_postdue3
- plo_npa
commit_collect_slots:
- plo_payment_intent
- plo_timeline
- plo_consent_2min
- callback_window
push_intent_slots:
- plo_payment_intent
- plo_timeline
# DEBT-016 (H3 reversal): slots whose refusal after commit triggers reversal.
# committed_date is cleared on fire; plo_payment_intent/plo_timeline re-asked.
reversal_slots:
- committed_date
- plo_payment_intent
- plo_timeline
main_ladder_prefixes:
- plo_opener
- plo_predue
- plo_ondue
- plo_postdue
- plo_npa
blocked_commands:
- cannot_handle
- human_handoff
deflection_objections:
- plo_obj_callback_pd
- plo_obj_npa_callback
pinned_flows:
- plo_obj_already_paid_pd
- plo_obj_npa_already_paid
- plo_obj_which_emi_pd
- plo_obj_which_emi
dispute_flows:
- plo_obj_deny_loan_pd
- plo_obj_deny_loan
- plo_obj_waiver_political_pd
- plo_obj_waiver_political
coercion_chain:
- dispute
- callback
- willing
- refusal
- identity
- reversal
- reason_catchall
# PLO-OOF P1: callback-request deflection flow (Tier-1 cue pack). Borrower
# asks to be called back / is busy / has no time → routed here verbatim.
callback_flow: plo_obj_callback_pd
respond_enabled: true
unknown_info_reply: "माफ़ कीजिए {customer_name} जी, यह जानकारी अभी मेरे पास उपलब्ध नहीं है। सही जानकारी के लिए कृपया {branch} ब्रांच या पैसालो हेल्पलाइन से संपर्क करें।"
# W1-B (H2 dead-air defense): terminal apology spoken by the go-server when
# ASR reconnect is exhausted (deaf) or TTS speak-fails twice (mute). Spoken in
# the unknown_info-register voice. PENDING-CLIENT-APPROVAL — see
# PAISALO_FRAGMENT_LIBRARY_V1.md §H candidate #55.
apology_dead_air: "माफ़ कीजिए, लाइन में तकनीकी समस्या आ रही है। हम आपसे थोड़ी देर में दोबारा संपर्क करेंगे। धन्यवाद।"
# Hits-only (P5.4 dry-run). Lexicon OCR variants that never appeared in copy
# (कानूनी कार्यवाही / कारवाही, सख़्त कार्यवाही, डिफ़ॉल्ट का सामना) omitted.
gate_allowlisted_phrases:
- कानूनी कार्रवाई
- सख़्त कार्रवाई
- सख्त कार्रवाई
- कानूनी परिणाम
- कानूनी प्रक्रिया
- NPA घोषित
- खाता NPA
- डिफॉल्ट हो सकता
scenario_selector: dpd_bucket_npa
frustration_escalate_turns: 3
reversal_target_flow: plo_predue
identity_slot: plo_identity_response
final_confirm_slot: ""
link_received_slot: ""
call_closed_slot: plo_call_closed
reason_slot: plo_timeline
