name: CI

on:
  push:
    branches: [main, master, "feature/**", "release/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: Black
        run: black --check app tests

      - name: Mypy
        run: mypy app

      - name: Reply manifest drift check
        run: python scripts/generate_reply_manifest.py --check

      # CP-TEST: tests/fixtures/console + tests/matrix run inside this job.
      - name: Pytest
        run: pytest -v
        env:
          STUB_MODE: "true"
